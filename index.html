<html lang="en">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at top, #512477 0%, transparent 55%),
    linear-gradient(145deg, #10041B, #230B3A, #12051F);
  color: #F3E8FF;
  text-align: center;
  min-height: 100vh;
  overflow-x: hidden;
}

header {
  padding: 28px 16px 12px;
}

header h2 {
  color: #E9D5FF;
  font-size: clamp(22px, 5vw, 30px);
  text-shadow: 0 0 18px #A855F7;
}

header p {
  margin-top: 10px;
  font-size: 14px;
  line-height: 1.7;
  color: #D8B4FE;
}

main {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 16px;
}

.page {
  display: none;
  min-height: 62vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  animation: appear 0.5s ease;
}

.page.active {
  display: flex;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  color: #E5C4FF;
  font-size: clamp(27px, 6vw, 46px);
  line-height: 1.3;
  overflow-wrap: anywhere;
  text-shadow: 0 0 20px rgba(192,132,252,0.3);
}

.cake {
  font-size: clamp(60px, 15vw, 85px);
  animation: heartbeat 1.8s infinite;
  filter: drop-shadow(0 0 15px rgba(192,132,252,0.3));
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.card {
  width: 100%;
  padding: clamp(20px, 5vw, 32px);
  background: rgba(48,20,70,0.82);
  border: 1px solid rgba(216,180,254,0.45);
  border-radius: 24px;
  box-shadow:
    0 8px 35px rgba(0,0,0,0.3),
    0 0 22px rgba(168,85,247,0.12);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.card p {
  font-size: clamp(16px, 4vw, 20px);
  line-height: 1.9;
  color: #F3E8FF;
  overflow-wrap: anywhere;
}

.buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 24px auto 12px;
  width: 100%;
}

button {
  background: linear-gradient(135deg,#A855F7,#7E22CE);
  color: white;
  border: 1px solid rgba(233,213,255,0.3);
  padding: 14px 22px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s;
  box-shadow: 0 4px 15px rgba(147,51,234,0.25);
  max-width: 100%;
  touch-action: manipulation;
}

button:hover {
  background: linear-gradient(135deg,#C084FC,#9333EA);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(168,85,247,0.4);
}

button:active {
  transform: scale(0.97);
}

button:focus-visible {
  outline: 2px solid #E9D5FF;
  outline-offset: 4px;
}

#count {
  font-size: 14px;
  margin: 20px 0;
  font-weight: bold;
  color: #D8B4FE;
}

.hearts {
  color: #C084FC;
  font-size: 20px;
  letter-spacing: 6px;
  padding: 10px 0;
  text-shadow: 0 0 12px #A855F7;
}

footer {
  padding: 24px 16px;
  font-size: 13px;
  line-height: 1.8;
  color: #CDB4E8;
}

/* Mobile responsive */
@media (max-width: 480px) {
  header {
    padding-top: 24px;
  }

  main {
    padding: 12px;
  }

  .page {
    min-height: 60vh;

  .buttons {

    font-size: 14px;
  }

  .page > button {
    padding: 14px 20px;
  }

  #count {
    margin: 18px 0;
  }

  footer {
    padding-bottom: 28px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

const container = document.getElementById("pages");

pages.forEach((p, i) => {
  const section = document.createElement("section");
  section.className = "page" + (i === 0 ? " active" : "");

  const emoji = document.createElement("div");
  emoji.className = "cake";
  emoji.textContent = p.emoji;

  const title = document.createElement("h1");
  title.textContent = p.title;

  const card = document.createElement("div");
  card.className = "card";

  const paragraph = document.createElement("p");
  paragraph.textContent = p.text;

  card.appendChild(paragraph);
  section.appendChild(emoji);
  section.appendChild(title);
  section.appendChild(card);

  if (p.button) {
    const button = document.createElement("button");
    button.textContent = p.button;

    button.onclick = () => {
      if (i === pages.length - 1) {
        goHome();
      } else {
        changePage(1);
      }
    };

    section.appendChild(button);
  }

  container.appendChild(section);
});

let current = 0;
const allPages = document.querySelectorAll(".page");

function showPage() {
  allPages.forEach((page, i) => {
    page.classList.toggle("active", i === current);
  });

  document.getElementById("count").textContent =
    `Page ${current + 1} of ${allPages.length} 💜`;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function changePage(step) {
  current = (current + step + allPages.length) % allPages.length;
  showPage();
}

function goHome() {
  current = 0;
  showPage();
}
</script>
